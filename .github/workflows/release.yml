name: Release

# The tag is the release. AGENTS.md has always said so — "Publish (`v*` tag) before
# redeploying it" — while this workflow published on every push to main and bumped the patch
# number itself. The shipped documentation described a process that did not exist.
#
# Publishing on merge also made every merge a release. A CI-only change spent a version
# number, and a change that raises the Node floor would have gone out as a patch, which is
# the one thing semver promises will not happen. npm has no real unpublish, so that promise
# has to be kept before the merge, not after it.
#
# workflow_dispatch stays as a recovery hatch: if the tag landed but publishing failed, it
# reruns from package.json. npm rejects a version it already holds, so it cannot double-publish.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish to npm & GitHub Release
    runs-on: ubuntu-latest

    steps:
      # Full history so the release notes can be generated from it. No token: nothing
      # pushes back to the repository any more.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      # Same source as CI (.nvmrc). The published artifact must be built by the
      # runtime the checks ran on.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Type Check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # Also on the pull request. It runs here too because this is the step that cannot be
      # taken back: npm has no real unpublish, so a contract that drifted between the review
      # and the merge would ship, and the only remedy would be publishing again.
      - name: Tool schema contract
        run: pnpm schemas:check

      - name: Exact decimals
        run: pnpm test:decimals

      # The version lives in package.json and is raised in the pull request, where a reviewer
      # sees it beside the change that justifies it. This step only checks that the tag agrees.
      # If it does not, npm would publish one version while the release notes name another,
      # and a published version cannot be taken back.
      - name: Tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v${TAG} does not match package.json ${PKG}" >&2
            echo "Raise the version in a pull request first, then tag the merge commit." >&2
            exit 1
          fi
          echo "v${TAG} matches package.json"

      - name: Show npm version
        run: npm -v

      # Same reason as the schema contract above: server.json names the version and the
      # start command, and the registry rejects a listing that disagrees with the package.
      - name: Registry manifest
        run: pnpm registry:check

      - name: Publish to npm
        run: npm publish --provenance --access public

      # Skipped on workflow_dispatch: there is no tag to attach a release to.
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true

      # The registry holds metadata only, so it goes last: it points at a package that has
      # to exist first. Authentication is a signature over lexq.io, proved by a TXT record
      # on the domain, which is what allows the `io.lexq` name instead of a GitHub handle.
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login dns --domain lexq.io --private-key "${{ secrets.MCP_PRIVATE_KEY }}"

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
