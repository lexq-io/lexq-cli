name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the public-surface check can read the commits on this branch.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      # The runtime lives in .nvmrc so CI and release cannot drift apart, and so
      # nvm/fnm give contributors the same version locally.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # src/types/enums.ts is generated from the engine contract manifest.
      # Fails if it was hand-edited, or if the committed subset was not regenerated.
      - name: Contract enums
        run: pnpm enums:check

      # Numbers stated as prose. The compiler keeps imported constants honest; skill docs,
      # CONTEXT.md and comments have no such guard, and this package ships all of them.
      - name: Contract constants in prose
        run: pnpm constants:check

      # Files always. On a pull request also the commit messages: a squash merge writes
      # the pull request body into this repository's history, so a cleanup that quotes
      # what it removed would put it back.
      - name: A/B identity key contract
        run: pnpm ab-key:check

      # The registry listing restates the package name, version and start command. A
      # disagreement is rejected at publish time, which is after npm has already published
      # and cannot be undone.
      - name: Registry manifest
        run: pnpm registry:check

      # The README names the MCP revisions this package serves. The SDK owns them, so a
      # dependency bump can change the answer without touching a line here.
      - name: Protocol revisions
        run: pnpm protocol:check

      - name: Public surface
        run: pnpm surface:check

      - name: Public surface (commit messages)
        if: github.event_name == 'pull_request'
        run: pnpm surface:check --commits origin/${{ github.base_ref }}

      - name: Type Check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # What `tools/list` returns is the contract an agent reads before it calls a tool.
      # It is assembled from the schemas by the SDK, so a dependency bump can rewrite it
      # while every other gate here stays green. Runs after Build: it reads dist/.
      - name: Tool schema contract
        run: pnpm schemas:check

      - name: Fact key grammar
        run: pnpm test:fact-key

      - name: Export format vocabulary
        run: pnpm test:export-format

      - name: Exact decimals
        run: pnpm test:decimals
